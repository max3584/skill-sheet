<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes">
<title>インフラ技術マップ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F1719; --panel:#141F21; --line:#233436; --ink:#DCE5E4;
  --muted2:#8B9E9C; --edge:#2C4245; --edge-hot:#6FD6BA; --flowline:#F2C94C;
  --fac:#D9A05B; --fac-bg:#2b2a22; --fac-st:#7e623d;
  --opt:#E8C15B; --opt-bg:#2d2f22; --opt-st:#86753d;
  --sub:#7FD4C1; --sub-bg:#1f3131; --sub-st:#4d7f75;
  --icx:#E7799F; --icx-bg:#2d252c; --icx-st:#864d63;
  --wl:#F2A5D1; --wl-bg:#2f2b33; --wl-st:#8c657e;
  --rt:#F09E9E; --rt-bg:#2f2a2c; --rt-st:#8b6162;
  --net:#3FBF9C; --net-bg:#162f2b; --net-st:#297361;
  --traf:#6E9BE8; --traf-bg:#1c2936; --traf-st:#43608b;
  --plat:#9B8CF0; --plat-bg:#232737; --plat-st:#5c578f;
  --data:#5FC7A8; --data-bg:#1a302d; --data-st:#3b7868;
  --sre:#7ED3F7; --sre-bg:#1f3138; --sre-st:#4c7e93;
  --ops:#A8B6E8; --ops-bg:#242d36; --ops-st:#636e8b;
  --lang:#F0B27A; --lang-bg:#2f2d27; --lang-st:#8b6c4e;
  --app:#E68A5C; --app-bg:#2d2722; --app-st:#85563e;
  --flow:#8FB8FF; --flow-bg:#212e39; --flow-st:#557098;
  --dsgn:#C77DD9; --dsgn-bg:#292534; --dsgn-st:#744f83;
  --proc:#B8C46A; --proc-bg:#272f24; --proc-st:#6c7646;
  --pf:#D7A3E8; --pf-bg:#2b2b36; --pf-st:#7d648b;
  --cross:#4FD2D2; --cross-bg:#183133; --cross-st:#327e7f;
  --arch:#8CC06A; --arch-bg:#212f24; --arch-st:#547446;
  --base:#9AA8A6; --base-bg:#222b2d; --base-st:#5b6767;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans JP",-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;
  font-weight:400;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:rgba(15,23,25,.94);
  border-bottom:1px solid var(--line);padding:10px 14px 8px}
h1{margin:0 0 2px;font-size:16px;font-weight:500;letter-spacing:.01em}
.sub{margin:0;font-size:12px;color:var(--muted2);line-height:1.5}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.flowbar{border-top:1px solid var(--line);padding-top:8px}
.flowbar .lbl{font-size:11.5px;color:var(--muted2);margin-right:2px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--muted2);
  border-radius:6px;padding:4px 9px;font-size:11.5px;font-family:inherit;cursor:pointer;
  display:inline-flex;align-items:center;gap:5px}
.chip:hover{border-color:#35494B;color:var(--ink)}
.chip:focus-visible{outline:2px solid var(--edge-hot);outline-offset:1px}
.chip[aria-pressed="true"]{color:var(--ink);border-color:#3D5254;background:#1A2729}
.flowchip[aria-pressed="true"]{border-color:var(--flowline);color:var(--flowline)}
.dot{width:8px;height:8px;border-radius:2px;display:inline-block}
.zoom{margin-left:auto;display:flex;gap:4px}
#status{font-size:11.5px;color:var(--muted2);margin-top:6px;min-height:16px;line-height:1.5}
#status b{color:var(--ink);font-weight:500}
#scroller{overflow:auto;-webkit-overflow-scrolling:touch;padding:10px 0 28px}
svg{display:block}
.node rect{transition:opacity .12s linear}
.node text{pointer-events:none}
.node{cursor:pointer}
.edge{fill:none;stroke:var(--edge);stroke-width:1;opacity:.24}
.dim{opacity:.035}
.node.dim{opacity:.1}
.edge.hot{stroke:var(--edge-hot);opacity:.95;stroke-width:1.6}
.flowpath{fill:none;stroke:var(--flowline);stroke-width:2.4;opacity:.95}
.flowseq{fill:var(--flowline);font-size:15px;font-weight:500}
.band{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:3 5}
.bandlabel{fill:var(--muted2);font-size:13px;font-weight:500}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>インフラ技術マップ</h1>
  <p class="sub">上2段が運ぶ側、下段が作る側。ノードをタップすると接続だけが残ります。背景をタップで解除。</p>
  <div class="bar">
    <button class="chip" data-g="arch" aria-pressed="false"><i class="dot" style="background:var(--arch)"></i>アーキテクチャ</button>
    <button class="chip" data-g="cross" aria-pressed="false"><i class="dot" style="background:var(--cross)"></i>横断</button>
    <button class="chip" data-g="base" aria-pressed="false"><i class="dot" style="background:var(--base)"></i>土台</button>
    <button class="chip" data-g="fac" aria-pressed="false"><i class="dot" style="background:var(--fac)"></i>ファシリティ / DC</button>
    <button class="chip" data-g="opt" aria-pressed="false"><i class="dot" style="background:var(--opt)"></i>伝送・光</button>
    <button class="chip" data-g="sub" aria-pressed="false"><i class="dot" style="background:var(--sub)"></i>加入者収容</button>
    <button class="chip" data-g="icx" aria-pressed="false"><i class="dot" style="background:var(--icx)"></i>相互接続</button>
    <button class="chip" data-g="wl" aria-pressed="false"><i class="dot" style="background:var(--wl)"></i>無線・モバイル</button>
    <button class="chip" data-g="rt" aria-pressed="false"><i class="dot" style="background:var(--rt)"></i>音声・リアルタイム</button>
    <button class="chip" data-g="net" aria-pressed="false"><i class="dot" style="background:var(--net)"></i>ネットワーク</button>
    <button class="chip" data-g="traf" aria-pressed="false"><i class="dot" style="background:var(--traf)"></i>帯域・輻輳制御</button>
    <button class="chip" data-g="plat" aria-pressed="false"><i class="dot" style="background:var(--plat)"></i>サーバ基盤</button>
    <button class="chip" data-g="data" aria-pressed="false"><i class="dot" style="background:var(--data)"></i>データ・永続化</button>
    <button class="chip" data-g="sre" aria-pressed="false"><i class="dot" style="background:var(--sre)"></i>SRE / 信頼性</button>
    <button class="chip" data-g="ops" aria-pressed="false"><i class="dot" style="background:var(--ops)"></i>運用・保守</button>
    <button class="chip" data-g="lang" aria-pressed="false"><i class="dot" style="background:var(--lang)"></i>言語・ランタイム</button>
    <button class="chip" data-g="app" aria-pressed="false"><i class="dot" style="background:var(--app)"></i>アプリ実装</button>
    <button class="chip" data-g="flow" aria-pressed="false"><i class="dot" style="background:var(--flow)"></i>データフロー / 連携</button>
    <button class="chip" data-g="dsgn" aria-pressed="false"><i class="dot" style="background:var(--dsgn)"></i>設計・方法論</button>
    <button class="chip" data-g="proc" aria-pressed="false"><i class="dot" style="background:var(--proc)"></i>開発プロセス・品質</button>
    <button class="chip" data-g="pf" aria-pressed="false"><i class="dot" style="background:var(--pf)"></i>プラットフォーム基盤</button>
    <span class="zoom">
      <button class="chip" id="zout">−</button>
      <button class="chip" id="zfit">全体</button>
      <button class="chip" id="zin">＋</button>
    </span>
  </div>
  <div class="bar flowbar"><span class="lbl">データの流れ</span>
    <button class="chip flowchip" data-f="0" aria-pressed="false">Web リクエスト</button>
    <button class="chip flowchip" data-f="1" aria-pressed="false">加入者トラフィック</button>
    <button class="chip flowchip" data-f="2" aria-pressed="false">ログ / テレメトリ</button>
    <button class="chip flowchip" data-f="3" aria-pressed="false">デプロイ</button>
    <button class="chip flowchip" data-f="4" aria-pressed="false">データ連携</button>
    <button class="chip flowchip" data-f="5" aria-pressed="false">インシデント対応</button>
    <button class="chip flowchip" data-f="6" aria-pressed="false">払い出し</button>
  </div>
  <div id="status"></div>
</header>
<div id="scroller"><svg id="map" viewBox="0 0 2716 2540" role="img" aria-label="インフラ技術領域のマップと、その上を通るデータの流れ"></svg></div>

function el(t,a){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e}
const defs=el("defs",{});
const mk=el("marker",{id:"fa",viewBox:"0 0 10 10",refX:"9",refY:"5",markerWidth:"5",markerHeight:"5",orient:"auto-start-reverse"});

BANDS.forEach(([x,y,w,h,label,lx,ly])=>{
  map.appendChild(el("rect",{x,y,width:w,height:h,rx:14,class:"band"}));
  const t=el("text",{x:lx,y:ly,class:"bandlabel"});t.textContent=label;map.appendChild(t);
});
const eg=el("g",{});map.appendChild(eg);
const edgeEls=[],adj={};
E.forEach(([a,b])=>{
  const A=byId[a],B=byId[b];if(!A||!B)return;
  (adj[a]=adj[a]||[]).push(b);(adj[b]=adj[b]||[]).push(a);
  const dx=B.x-A.x,dy=B.y-A.y,len=Math.hypot(dx,dy)||1,bow=Math.min(len*.06,58);
  const mx=(A.x+B.x)/2-dy/len*bow,my=(A.y+B.y)/2+dx/len*bow;
  const p=el("path",{d:"M"+A.x+" "+A.y+" Q"+mx+" "+my+" "+B.x+" "+B.y,class:"edge"});
  p.dataset.a=a;p.dataset.b=b;eg.appendChild(p);edgeEls.push(p);
});
const ng=el("g",{});map.appendChild(ng);
const fg=el("g",{});map.appendChild(fg);
const nodeEls={};
N.forEach(([id,label,g,x,y])=>{

  gr.dataset.id=id;gr.dataset.g=g;
  gr.appendChild(el("rect",{x:x-W/2,y:y-H/2,width:W,height:H,rx:7,

function clear(){
  edgeEls.forEach(p=>p.classList.remove("hot","dim"));
  Object.values(nodeEls).forEach(n=>n.classList.remove("dim"));
  while(fg.firstChild)fg.removeChild(fg.firstChild);
  status.textContent=base;
  document.querySelectorAll(".chip[data-g],.flowchip").forEach(c=>c.setAttribute("aria-pressed","false"));
}
function focusNode(id){
  clear();
  const keep=new Set([id].concat(adj[id]||[]));
  edgeEls.forEach(p=>{p.classList.add(p.dataset.a===id||p.dataset.b===id?"hot":"dim")});
  Object.values(nodeEls).forEach(n=>{if(!keep.has(n.dataset.id))n.classList.add("dim")});
  status.innerHTML="<b>"+byId[id].label+"</b> — 接続 "+(deg[id]||0);
}
function focusGroup(g){
  clear();
  edgeEls.forEach(p=>{p.classList.add(byId[p.dataset.a].g===g||byId[p.dataset.b].g===g?"hot":"dim")});
  Object.values(nodeEls).forEach(n=>{
    const nb=(adj[n.dataset.id]||[]).some(m=>byId[m].g===g);
    if(n.dataset.g!==g&&!nb)n.classList.add("dim");
  });
  const chip=document.querySelector('.chip[data-g="'+g+'"]');
  status.innerHTML="<b>"+chip.textContent.trim()+"</b> — "+N.filter(n=>n[2]===g).length+" ノードと、その接続先";
  chip.setAttribute("aria-pressed","true");
}
function edgePoint(A,B){
  const dx=B.x-A.x,dy=B.y-A.y;
  const sx=dx===0?Infinity:(W/2+6)/Math.abs(dx), sy=dy===0?Infinity:(H/2+6)/Math.abs(dy);
  const s=Math.min(sx,sy);return [A.x+dx*s,A.y+dy*s];
}
function showFlow(fi){
  clear();
  const [name,seq]=FLOWS[fi];
  const set=new Set(seq);
  edgeEls.forEach(p=>p.classList.add("dim"));
  Object.values(nodeEls).forEach(n=>{if(!set.has(n.dataset.id))n.classList.add("dim")});
  for(let k=0;k<seq.length-1;k++){
    const A=byId[seq[k]],B=byId[seq[k+1]];
    const [x1,y1]=edgePoint(A,B),[x2,y2]=edgePoint(B,A);
    const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)||1,bow=Math.min(len*.1,70);
    const mx=(x1+x2)/2-dy/len*bow,my=(y1+y2)/2+dx/len*bow;
    fg.appendChild(el("path",{d:"M"+x1+" "+y1+" Q"+mx+" "+my+" "+x2+" "+y2,class:"flowpath","marker-end":"url(#fa)"}));
  }
  seq.forEach((id,k)=>{const n=byId[id];
    const t=el("text",{x:n.x-W/2+8,y:n.y-H/2-6,class:"flowseq"});t.textContent=(k+1);fg.appendChild(t)});
  status.innerHTML="<b>"+name+"</b> — "+seq.map(id=>byId[id].label).join(" → ");
  document.querySelector('.flowchip[data-f="'+fi+'"]').setAttribute("aria-pressed","true");
}

});
const sc=document.getElementById("scroller");

function setW(px){scale=px;map.setAttribute("width",px);map.style.width=px+"px"}
function fit(){scale=null;map.removeAttribute("width");map.style.width="100%"}
function nudge(f){const w=scale||sc.clientWidth;setW(Math.max(560,Math.min(11000,Math.round(w*f))))}
document.getElementById("zin").addEventListener("click",()=>nudge(1.35));
document.getElementById("zout").addEventListener("click",()=>nudge(1/1.35));
document.getElementById("zfit").addEventListener("click",fit);
if(sc.clientWidth<1400){setW(2716)}else{fit()}
