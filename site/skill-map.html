*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
 font-family:"IBM Plex Sans JP",-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;-webkit-text-size-adjust:100%}
#app{display:flex;flex-direction:column;height:100%}
header{flex:0 0 auto;background:var(--bg);border-bottom:1px solid var(--line);padding:9px 12px 8px}
h1{margin:0;font-size:15px;font-weight:500}
.hint{margin:2px 0 0;font-size:11.5px;color:var(--muted)}
.bar{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}
button{font-family:inherit;font-size:11.5px;color:var(--ink);background:var(--panel);
 border:1px solid var(--line);border-radius:6px;padding:5px 8px;cursor:pointer}
button:hover{border-color:#3D5254}
button:focus-visible{outline:2px solid var(--hot);outline-offset:1px}
button.on{border-color:var(--hot);color:var(--hot)}
.panel{position:absolute;left:8px;right:8px;top:8px;z-index:4;background:rgba(17,26,28,.97);
 border:1px solid var(--line);border-radius:10px;padding:8px 10px 10px;
 max-height:min(62%,520px);overflow-y:auto;overscroll-behavior:contain;
 touch-action:pan-y;-webkit-overflow-scrolling:touch}
.panel.hide{display:none}
.sec{margin-bottom:7px}
.sect{display:block;font-size:10.5px;color:var(--muted);margin:2px 0 5px;letter-spacing:.04em}
.panel .chip{margin:0 5px 5px 0;padding:5px 9px;border-radius:15px;display:inline-flex;
 align-items:center;gap:6px;font-size:12px}
.panel .chip i{width:9px;height:9px;border-radius:2px;display:inline-block;flex:0 0 auto}
.panel .chip.on{border-color:var(--hot);background:#15282A;color:var(--ink)}
.sp{margin-left:auto;display:flex;gap:5px}
#status{font-size:11.5px;color:var(--muted);margin-top:7px;line-height:1.45;
 max-height:2.9em;overflow:hidden}
#status b{color:var(--ink);font-weight:500}
#stage{flex:1 1 auto;position:relative;overflow:hidden;touch-action:none;cursor:grab}
#stage.drag{cursor:grabbing}

svg{width:100%;height:100%;display:block}
.node{cursor:pointer}.node text{pointer-events:none}
.node rect,.edge{transition:opacity .1s linear}
.edge{fill:none;stroke:var(--edge);stroke-width:1;opacity:.22}
.edge.dim{opacity:.03}.node.dim{opacity:.09}
.edge.hot{stroke:var(--hot);opacity:.95;stroke-width:1.7}
.flowpath{fill:none;stroke:var(--flowline);stroke-width:2.6;opacity:.95}
.flowseq{fill:var(--flowline);font-size:13px;font-weight:500}
.band{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:3 5}
.gbox{fill:#121D1F;stroke:#2E4245;stroke-width:1.5}
.glabel{fill:#A8BCB9;font-size:15px;font-weight:500;letter-spacing:.06em}
.secbody{display:block}
.sect.gsec{background:none;border:0;padding:0 0 5px;color:var(--muted);cursor:pointer;
 font-size:10.5px;letter-spacing:.04em;text-align:left}
.sect.gsec:hover{color:var(--ink)}
.blabel{fill:var(--muted);font-size:12px;font-weight:500}

 seq.forEach((id,k)=>{const n=byId[id];const t=el("text",{x:n.x-W/2+6,y:n.y-H/2-4,class:"flowseq"});t.textContent=k+1;fg.appendChild(t)});
 status.innerHTML="<b>"+name+"</b> — "+seq.map(id=>byId[id].label).join(" → ");
 const ns=seq.map(id=>byId[id]);
 zoomTo([Math.min(...ns.map(n=>n.x))-100,Math.min(...ns.map(n=>n.y))-40,Math.max(...ns.map(n=>n.x))+100,Math.max(...ns.map(n=>n.y))+40],60)}
let cur=null;
ng.addEventListener("keydown",e=>{if(e.key!=="Enter"&&e.key!==" ")return;
 const g=e.target.closest(".node");if(!g)return;e.preventDefault();cur=g.dataset.id;focusNode(cur)});
const GLAB={"arch":"アーキテクチャ","cross":"横断領域","base":"土台","fac":"ファシリティ / DC","opt":"伝送・光","sub":"加入者収容","icx":"相互接続","wl":"無線・モバイル","rt":"音声・リアルタイム","sw":"スイッチング","ro":"ルーティング","na":"NAT / アドレス変換","lb":"ロードバランス","px":"プロキシ","vp":"VPN","fw":"ファイアウォール","wf":"WAF / アプリ防御","ds":"IDS / IPS","traf":"帯域・輻輳制御","bm":"サーバ / ベアメタル","vz":"仮想化","st":"ストレージ","kb":"コンテナ / Kubernetes","dns":"DNS / 名前解決","id":"ID / ディレクトリ基盤","cloud":"クラウド","pf":"プラットフォーム基盤","lang":"言語・ランタイム","ap":"Web / API","au":"認証・認可実装","cl":"クライアント / 配信","data":"データ・永続化","flow":"データフロー / 連携","obs":"可観測性","ts":"障害対応 / 切り分け","sre":"SRE / 信頼性","ops":"運用・保守","dsgn":"設計・方法論","proc":"開発プロセス・品質"};
const gpanel=document.getElementById("gpanel"),fpanel=document.getElementById("fpanel");
const gbtn=document.getElementById("gbtn"),fbtn=document.getElementById("fbtn");
function panel(p,on){p.classList.toggle("hide",!on);
 gbtn.classList.toggle("on",!gpanel.classList.contains("hide"));
 fbtn.classList.toggle("on",!fpanel.classList.contains("hide"))}
gbtn.onclick=()=>{const o=gpanel.classList.contains("hide");panel(fpanel,false);panel(gpanel,o)};
fbtn.onclick=()=>{const o=fpanel.classList.contains("hide");panel(gpanel,false);panel(fpanel,o)};
function setChip(sel){document.querySelectorAll(".panel .chip").forEach(c=>
 c.classList.toggle("on",sel!=null&&(c.dataset.g===sel||c.dataset.f===sel)));
 document.querySelectorAll(".gsec").forEach(b=>b.classList.remove("on"))}
function focusSet(keys,lab,box){clearAll();const S=new Set(keys);
 edgeEls.forEach(p=>p.classList.add(S.has(byId[p.dataset.a].g)&&S.has(byId[p.dataset.b].g)?"hot":
  (S.has(byId[p.dataset.a].g)||S.has(byId[p.dataset.b].g)?"":"dim")));
 Object.values(nodeEls).forEach(n=>{if(!S.has(n.dataset.g)&&!(adj[n.dataset.id]||[]).some(m=>S.has(byId[m].g)))n.classList.add("dim")});
 status.innerHTML="<b>"+lab+"</b> — "+keys.length+" 機能 / "+keys.reduce((a,k)=>a+N.filter(n=>n[2]===k).length,0)+" ノード";
 zoomTo(box,50)}
const GRPX=Object.assign({bands:{label:"全体に刺さるもの",keys:["arch","cross","base"]}},GRP);
document.querySelectorAll(".gsec").forEach(b=>b.onclick=()=>{
 cur=null;const gk=b.dataset.gb;setChip(null);b.classList.add("on");
 focusSet(GRPX[gk].keys,GRPX[gk].label,GB[gk]);panel(gpanel,false)});
document.querySelectorAll("#gpanel .chip").forEach(c=>c.onclick=()=>{
 cur=null;const g=c.dataset.g;
 if(c.classList.contains("on")){setChip(null);clearAll();fitAll()}
 else{setChip(g);focusGroup(g)}
 panel(gpanel,false)});
document.querySelectorAll("#fpanel .chip").forEach(c=>c.onclick=()=>{
 cur=null;const f=c.dataset.f;
 if(c.classList.contains("on")){setChip(null);clearAll();fitAll()}
 else{setChip(f);showFlow(+f)}
 panel(fpanel,false)});
[gpanel,fpanel].forEach(p=>p.addEventListener("wheel",e=>e.stopPropagation(),{passive:true}));
document.getElementById("clr").onclick=()=>{cur=null;setChip(null);clearAll();fitAll();
 panel(gpanel,false);panel(fpanel,false)};
function scale(f,cx,cy){const nw=Math.max(500,Math.min(FULL.w*1.6,vb.w*f)),nh=nw*vb.h/vb.w;
 const rx=(cx-vb.x)/vb.w,ry=(cy-vb.y)/vb.h;
 vb={x:cx-nw*rx,y:cy-nh*ry,w:nw,h:nh};apply()}
document.getElementById("zi").onclick=()=>scale(1/1.4,vb.x+vb.w/2,vb.y+vb.h/2);
document.getElementById("zo").onclick=()=>scale(1.4,vb.x+vb.w/2,vb.y+vb.h/2);
document.getElementById("za").onclick=()=>{cur=null;gsel.value="";fsel.value="";clearAll();fitAll()};
function toSvg(cx,cy){const r=stage.getBoundingClientRect();
 const s=Math.max(vb.w/r.width,vb.h/r.height);
 return[vb.x+vb.w/2+(cx-r.left-r.width/2)*s, vb.y+vb.h/2+(cy-r.top-r.height/2)*s]}
stage.addEventListener("wheel",e=>{
 if(e.target.closest(".panel"))return;
 e.preventDefault();
 const r=stage.getBoundingClientRect(),sc=Math.max(vb.w/r.width,vb.h/r.height);
 if(e.shiftKey){vb.x+=(e.deltaY||e.deltaX)*sc;apply();return}
 if(e.altKey){vb.y+=e.deltaY*sc;apply();return}
 const[px,py]=toSvg(e.clientX,e.clientY);
 const d=e.deltaY||e.deltaX;if(!d)return;
 scale(d>0?1.12:1/1.12,px,py)},{passive:false});
stage.addEventListener("dblclick",e=>{const[px,py]=toSvg(e.clientX,e.clientY);scale(1/1.8,px,py)});
addEventListener("keydown",e=>{
 const t=e.target.tagName;if(t==="SELECT"||t==="INPUT"||t==="TEXTAREA")return;
 const step=vb.w*(e.shiftKey?.5:.18);let hit=true;
 switch(e.key){
  case "ArrowLeft":case "a":vb.x-=step;break;
  case "ArrowRight":case "d":vb.x+=step;break;
  case "ArrowUp":case "w":vb.y-=step*vb.h/vb.w;break;
  case "ArrowDown":case "s":vb.y+=step*vb.h/vb.w;break;
  case "+":case "=":scale(1/1.4,vb.x+vb.w/2,vb.y+vb.h/2);return;
  case "-":scale(1.4,vb.x+vb.w/2,vb.y+vb.h/2);return;
  case "0":setChip(null);cur=null;clearAll();fitAll();panel(gpanel,false);panel(fpanel,false);return;
  case "Escape":setChip(null);cur=null;clearAll();panel(gpanel,false);panel(fpanel,false);return;
  default:hit=false}
 if(hit){e.preventDefault();apply()}});
const pts=new Map();let last=null,moved=0,downNode=null;
stage.addEventListener("pointerdown",e=>{if(e.target.closest(".panel"))return;
 panel(gpanel,false);panel(fpanel,false);
 cancelAnimationFrame(raf);vx=vy=0;pts.set(e.pointerId,e);
 downNode=e.target.closest(".node");
 stage.classList.add("drag");moved=0;last=null});
addEventListener("pointermove",e=>{if(!pts.has(e.pointerId))return;
 const prev=pts.get(e.pointerId);pts.set(e.pointerId,e);
 const r=stage.getBoundingClientRect(),s=Math.max(vb.w/r.width,vb.h/r.height);
 if(pts.size===1){const dx=(e.clientX-prev.clientX)*s,dy=(e.clientY-prev.clientY)*s;
  moved+=Math.abs(dx)+Math.abs(dy);vx=dx;vy=dy;vb.x-=dx;vb.y-=dy;apply()}
 else if(pts.size===2){const[a,b]=[...pts.values()];
  const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
  if(last){const[px,py]=toSvg((a.clientX+b.clientX)/2,(a.clientY+b.clientY)/2);scale(last/d,px,py)}
  last=d;moved=99}});
function tap(){setChip(null);
 if(!downNode){if(cur){cur=null;clearAll()}return}
 const id=downNode.dataset.id;
 if(cur===id){cur=null;clearAll()}else{cur=id;focusNode(id)}}
["pointerup","pointercancel"].forEach(t=>addEventListener(t,e=>{
 const had=pts.has(e.pointerId);pts.delete(e.pointerId);if(pts.size<2)last=null;
 if(pts.size===0){stage.classList.remove("drag");
  if(had&&moved<=8&&e.type==="pointerup")tap();else glide()}}));
let vx=0,vy=0,raf=0;
function glide(){cancelAnimationFrame(raf);
 if(Math.abs(vx)+Math.abs(vy)<1)return;
 const step=()=>{vx*=.92;vy*=.92;vb.x-=vx;vb.y-=vy;apply();
  if(Math.abs(vx)+Math.abs(vy)>1)raf=requestAnimationFrame(step)};
 raf=requestAnimationFrame(step)}

addEventListener("resize",()=>{const c=[vb.x+vb.w/2,vb.y+vb.h/2];const r=stage.clientWidth/stage.clientHeight;
 let w=vb.w,h=vb.h;if(w/h<r)w=h*r;else h=w/r;vb={x:c[0]-w/2,y:c[1]-h/2,w,h};apply()});
status.textContent=BASE;fitAll();
